components:
    schemas:
        AuditEvent:
            description:
                An audit log entry.
            properties:
                accountId:
                    description:
                        Identifier of the account the event was scoped to, when an account context was present.
                    format: int64
                    readOnly: true
                    type: integer
                additionalInfo:
                    additionalProperties: true
                    description:
                        Structured payload captured at the configured log detail level.
                    readOnly: true
                    type: object
                clientHost:
                    description:
                        Hostname of the client that initiated the audited request.
                    readOnly: true
                    type: string
                clientIP:
                    description:
                        IP address of the client that initiated the audited request.
                    readOnly: true
                    type: string
                contextName:
                    description:
                        Logical segregation key (e.g., subsystem or feature area that emitted the event).
                    readOnly: true
                    type: string
                creator:
                    $ref: ../../headless/headless-delivery/headless-delivery-impl/rest-openapi.yaml#Creator
                    readOnly: true
                dateCreated:
                    format: date-time
                    readOnly: true
                    type: string
                entityId:
                    description:
                        Identifier of the entity the event is about, within its type.
                    format: int64
                    readOnly: true
                    type: integer
                entityType:
                    description:
                        Fully-qualified class name of the entity the event is about.
                    readOnly: true
                    type: string
                eventType:
                    readOnly: true
                    type: string
                id:
                    format: int64
                    readOnly: true
                    type: integer
                message:
                    readOnly: true
                    type: string
                serverName:
                    description:
                        Hostname of the server that processed the audited request.
                    readOnly: true
                    type: string
                serverPort:
                    description:
                        Port of the server that processed the audited request.
                    format: int32
                    readOnly: true
                    type: integer
                sessionId:
                    description:
                        HTTP session identifier of the audited request.
                    readOnly: true
                    type: string
            required: [id, dateCreated, eventType]
            type: object
info:
    description:
        "REST API for account-scoped audit log entries.. A Java client JAR is available for use with the group ID
        'com.liferay', artifact ID 'com.liferay.portal.security.audit.rest.client', and version '1.0.0'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Audit
    version: v1.0
openapi: 3.0.1
paths:
    "/audit-events":
        get:
            description:
                Retrieves a paginated list of audit log entries, scoped to the caller's accessible accounts.
            operationId: getAuditEventsPage
            parameters:
                -   in: query
                    name: contextName
                    schema:
                        type: string
                -   in: query
                    name: endDate
                    schema:
                        format: date-time
                        type: string
                -   in: query
                    name: eventType
                    schema:
                        type: string
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    name: sort
                    schema:
                        type: string
                -   in: query
                    name: startDate
                    schema:
                        format: date-time
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AuditEvent"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AuditEvent"
                                type: array
            tags: ["AuditEvent"]
    "/audit-events/by-context-name/{contextName}":
        get:
            description:
                Retrieves a paginated list of audit log entries that share the given context, scoped to the caller's
                accessible accounts.
            operationId: getAuditEventByContextNameContextNamePage
            parameters:
                -   in: path
                    name: contextName
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: endDate
                    schema:
                        format: date-time
                        type: string
                -   in: query
                    name: eventType
                    schema:
                        type: string
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    name: sort
                    schema:
                        type: string
                -   in: query
                    name: startDate
                    schema:
                        format: date-time
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AuditEvent"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AuditEvent"
                                type: array
            tags: ["AuditEvent"]
    "/audit-events/{auditEventId}":
        get:
            description:
                Retrieves a single audit log entry by ID, including the full structured payload.
            operationId: getAuditEvent
            parameters:
                -   in: path
                    name: auditEventId
                    required: true
                    schema:
                        format: int64
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuditEvent"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/AuditEvent"
            tags: ["AuditEvent"]