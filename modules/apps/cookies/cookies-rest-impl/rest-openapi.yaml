components:
    schemas:
        ConsentPreference:
            description:
                Stored value of a user's consent preference cookie.
            properties:
                domain:
                    description:
                        The domain of the consent preference cookie.
                    type: string
                expirationDate:
                    format: date-time
                    type: string
                id:
                    description:
                        The consent preference ID.
                    format: int64
                    readOnly: true
                    type: integer
                name:
                    description:
                        The name of the consent preference cookie.
                    type: string
                userId:
                    description:
                        The user's ID.
                    format: int64
                    type: integer
                value:
                    description:
                        The value of the consent preference cookie.
                    type: string
            required:
                -   domain
                -   expirationDate
                -   name
                -   userId
                -   value
            type: object
info:
    description:
        "A Java client JAR is available for use with the group ID 'com.liferay', artifact ID
        'com.liferay.cookies.rest.client', and version '1.0.0'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Cookies
    version: v1.0
openapi: 3.0.1
paths:
    "/consent-preference/by-name/{name}":
        delete:
            description:
                Deletes the specified consent preference of the user who made the request.
            operationId: deleteConsentPreferenceByName
            parameters:
                -   in: path
                    name: name
                    required: true
                    schema:
                        type: string
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
            tags: ["ConsentPreference"]
        get:
            description:
                Retrieves the specified consent preference of the user who made the request.
            operationId: getConsentPreferenceByName
            parameters:
                -   in: path
                    name: name
                    required: true
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ConsentPreference"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/ConsentPreference"
            tags: ["ConsentPreference"]
    "/consent-preferences":
        delete:
            description:
                Deletes consent preferences of the user who made the request.
            operationId: deleteConsentPreferences
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
            tags: ["ConsentPreference"]
        get:
            description:
                Retrieves the consent preferences of the user who made the request.
            operationId: getConsentPreferencesPage
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/ConsentPreference"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/ConsentPreference"
                                type: array
            tags: ["ConsentPreference"]
        put:
            description:
                Replaces the consent preference with information sent in the request body. Any missing fields are
                deleted unless they are required.
            operationId: putConsentPreference
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ConsentPreference"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/ConsentPreference"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ConsentPreference"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/ConsentPreference"
                    description:
                        "Consent Preference successfully replaced"
            tags: ["ConsentPreference"]